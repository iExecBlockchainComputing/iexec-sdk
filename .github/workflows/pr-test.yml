name: PR test

on: [pull_request]

permissions: {}

concurrency:
  group: ${{ github.ref }}-pr-test
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run codegen

      - name: Check format
        run: npm run check-format

      - name: Lint
        run: npm run lint

  test:
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      node-version: '20'

  test-supported-node-versions:
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    # for release PR run tests on all supported node versions
    if: startsWith(github.head_ref,'release-please--')
    strategy:
      matrix:
        node-version: ['22', '24']
    with:
      node-version: ${{ matrix.node-version }}

  npm-dry-run:
    uses: ./.github/workflows/reusable-npm.yml
    # publish-npm requests these permissions statically, even in dry-run
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      dry-run: true

  docker-dry-run:
    uses: ./.github/workflows/reusable-docker.yml
    permissions:
      pull-requests: write
      contents: read
    with:
      dry-run: true
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}
